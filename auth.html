<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TradeZora — Account</title>
<link rel="stylesheet" href="styles.css">

<style>
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 50% 0,#0b2419 0,#050807 42%);
}

.auth{
  width:min(460px,calc(100% - 30px));
  background:#0c1210;
  border:1px solid #1c2923;
  border-radius:20px;
  padding:30px;
  box-shadow:0 25px 70px #0008;
}

.auth .logo{
  display:block;
  text-align:center;
  margin-bottom:25px;
  color:#fff;
  text-decoration:none;
  font-size:25px;
  font-weight:800;
}

.auth .logo span{
  color:#fff;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#07100c;
  padding:4px;
  border-radius:10px;
  margin-bottom:24px;
}

.tabs button{
  border:0;
  background:transparent;
  color:#8f9b96;
  padding:11px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.tabs button.active{
  background:#16e58a;
  color:#031009;
}

.form{
  display:grid;
  gap:14px;
}

.form h1{
  font-size:28px;
  margin:0;
}

.form p{
  color:#8f9b96;
  font-size:13px;
  margin:0 0 5px;
}

.form label{
  font-size:12px;
  color:#c8d0cc;
}

.form input{
  width:100%;
  margin-top:6px;
  padding:13px;
  border-radius:10px;
  border:1px solid #1c2923;
  background:#07100c;
  color:#fff;
  outline:0;
  box-sizing:border-box;
}

.form input:focus{
  border-color:#16e58a;
}

.form button{
  padding:13px;
  border:0;
  border-radius:10px;
  background:#16e58a;
  color:#031009;
  font-weight:800;
  cursor:pointer;
  margin-top:5px;
}

.form button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.msg{
  min-height:20px;
  color:#16e58a;
  font-size:12px;
  text-align:center;
  line-height:1.5;
}

.error{
  color:#ff5d6c;
}

.forgot-link{
  display:block;
  text-align:right;
  margin-top:-5px;
  color:#16e58a;
  font-size:12px;
  text-decoration:none;
  cursor:pointer;
}

.forgot-link:hover{
  text-decoration:underline;
}

.back{
  text-align:center;
  margin-top:20px;
}

.back a{
  color:#8f9b96;
  text-decoration:none;
  font-size:12px;
}

.back a:hover{
  color:#16e58a;
}

.secondary-link{
  display:block;
  text-align:center;
  margin-top:4px;
  color:#8f9b96;
  font-size:12px;
  text-decoration:none;
  cursor:pointer;
}

.secondary-link:hover{
  color:#16e58a;
}

.notice{
  background:#071710;
  border:1px solid #173528;
  border-radius:10px;
  padding:12px;
  color:#8f9b96;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

@media(max-width:520px){
  .auth{
    padding:24px 20px;
    border-radius:16px;
  }

  .form h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<main class="auth">

<a class="logo" href="index.html">
  <span>Trade</span>Zora
</a>

<div class="tabs">
  <button id="signupTab" class="active" type="button">
    Create Account
  </button>

  <button id="loginTab" type="button">
    Log In
  </button>
</div>


<!-- CREATE ACCOUNT -->

<form id="signup" class="form">

  <h1>Create your demo account</h1>

  <p>
    Demo only. No real money or Deriv connection is used.
  </p>

  <label>
    Full Name
    <input
      id="signupName"
      type="text"
      autocomplete="name"
      required
    >
  </label>

  <label>
    Email
    <input
      id="signupEmail"
      type="email"
      autocomplete="email"
      required
    >
  </label>

  <label>
    Password
    <input
      id="signupPassword"
      type="password"
      minlength="8"
      autocomplete="new-password"
      required
    >
  </label>

  <button id="signupButton" type="submit">
    Create Demo Account
  </button>

  <div id="signupMsg" class="msg"></div>

</form>


<!-- LOGIN -->

<form id="login" class="form" style="display:none">

  <h1>Welcome back</h1>

  <p>
    Log in to your TradeZora demo account.
  </p>

  <label>
    Email
    <input
      id="loginEmail"
      type="email"
      autocomplete="email"
      required
    >
  </label>

  <label>
    Password
    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      required
    >
  </label>

  <a
    id="forgotLink"
    class="forgot-link"
    href="#"
  >
    Forgot password?
  </a>

  <button id="loginButton" type="submit">
    Log In
  </button>

  <div id="loginMsg" class="msg"></div>

</form>


<!-- FORGOT PASSWORD -->

<form id="forgotPassword" class="form" style="display:none">

  <h1>Reset your password</h1>

  <p>
    Enter the email address connected to your TradeZora account.
  </p>

  <label>
    Email
    <input
      id="forgotEmail"
      type="email"
      autocomplete="email"
      required
    >
  </label>

  <button id="forgotButton" type="submit">
    Send Reset Link
  </button>

  <div id="forgotMsg" class="msg"></div>

  <a
    id="backToLogin"
    class="secondary-link"
    href="#"
  >
    ← Back to Log In
  </a>

</form>


<div class="back">
  <a href="index.html">← Back to TradeZora</a>
</div>

</main>


<script>

/* =========================================================
   TRADEZORA BACKEND
   ========================================================= */

const API_BASE =
  "https://tradezora-backend-use.onrender.com";


document.addEventListener("DOMContentLoaded", () => {

  const signupTab =
    document.getElementById("signupTab");

  const loginTab =
    document.getElementById("loginTab");

  const signupForm =
    document.getElementById("signup");

  const loginForm =
    document.getElementById("login");

  const forgotForm =
    document.getElementById("forgotPassword");


  const signupName =
    document.getElementById("signupName");

  const signupEmail =
    document.getElementById("signupEmail");

  const signupPassword =
    document.getElementById("signupPassword");


  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");


  const forgotEmail =
    document.getElementById("forgotEmail");


  const signupMsg =
    document.getElementById("signupMsg");

  const loginMsg =
    document.getElementById("loginMsg");

  const forgotMsg =
    document.getElementById("forgotMsg");


  const signupButton =
    document.getElementById("signupButton");

  const loginButton =
    document.getElementById("loginButton");

  const forgotButton =
    document.getElementById("forgotButton");


  const forgotLink =
    document.getElementById("forgotLink");

  const backToLogin =
    document.getElementById("backToLogin");


  /* =========================================================
     SHOW FORM
     ========================================================= */

  function showForm(type){

    signupForm.style.display =
      type === "signup" ? "grid" : "none";

    loginForm.style.display =
      type === "login" ? "grid" : "none";

    forgotForm.style.display =
      type === "forgot" ? "grid" : "none";


    signupTab.classList.toggle(
      "active",
      type === "signup"
    );

    loginTab.classList.toggle(
      "active",
      type === "login"
    );


    signupMsg.textContent = "";
    loginMsg.textContent = "";
    forgotMsg.textContent = "";
  }


  /* =========================================================
     TAB SWITCHING
     ========================================================= */

  signupTab.onclick = () =>
    showForm("signup");

  loginTab.onclick = () =>
    showForm("login");


  forgotLink.onclick = (e) => {

    e.preventDefault();

    if(loginEmail.value.trim()){
      forgotEmail.value =
        loginEmail.value.trim();
    }

    showForm("forgot");

  };


  backToLogin.onclick = (e) => {

    e.preventDefault();

    if(forgotEmail.value.trim()){
      loginEmail.value =
        forgotEmail.value.trim();
    }

    showForm("login");

  };


  /* =========================================================
     SAVE BACKEND SESSION
     ========================================================= */

  function saveSession(data){

    /*
      IMPORTANT:
      The TradeZora backend returns:

      session_token

      NOT:

      token
    */

    if(!data || !data.session_token){

      throw new Error(
        "The server did not return a session token."
      );

    }


    localStorage.setItem(
      "tradezoraAuthToken",
      data.session_token
    );


    if(data.user){

      localStorage.setItem(
        "tradezoraDemoUser",
        JSON.stringify({
          id:data.user.id,
          name:data.user.name,
          email:data.user.email
        })
      );


      if(
        data.user.balance !== undefined &&
        data.user.balance !== null
      ){

        localStorage.setItem(
          "tradezoraDemoBalance",
          String(data.user.balance)
        );

      }

    }

  }


  /* =========================================================
     CREATE ACCOUNT
     ========================================================= */

  signupForm.onsubmit = async (e) => {

    e.preventDefault();


    signupMsg.style.color =
      "#8f9b96";

    signupMsg.textContent =
      "Creating your account…";

    signupButton.disabled = true;


    const name =
      signupName.value.trim();

    const email =
      signupEmail.value
        .trim()
        .toLowerCase();

    const password =
      signupPassword.value;


    /* Validate name */

    if(!name){

      signupMsg.style.color =
        "#ff5d6c";

      signupMsg.textContent =
        "Please enter your full name.";

      signupButton.disabled = false;

      return;

    }


    /* Validate email */

    if(!email){

      signupMsg.style.color =
        "#ff5d6c";

      signupMsg.textContent =
        "Please enter your email.";

      signupButton.disabled = false;

      return;

    }


    /* Validate password */

    if(password.length < 8){

      signupMsg.style.color =
        "#ff5d6c";

      signupMsg.textContent =
        "Password must be at least 8 characters.";

      signupButton.disabled = false;

      return;

    }


    try{

      const response =
        await fetch(
          `${API_BASE}/api/auth/register`,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              name,
              email,
              password
            })
          }
        );


      const data =
        await response.json()
          .catch(() => ({}));


      if(!response.ok){

        throw new Error(
          data.error ||
          data.message ||
          "Unable to create your account."
        );

      }


      /* Save the real backend session */

      saveSession(data);


      signupMsg.style.color =
        "#16e58a";

      signupMsg.textContent =
        "Account created with $10,000 demo balance. Opening dashboard…";


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      },700);


    }catch(error){

      console.error(
        "TradeZora signup error:",
        error
      );


      signupMsg.style.color =
        "#ff5d6c";

      signupMsg.textContent =
        error.message ||
        "Unable to create your account.";

      signupButton.disabled = false;

    }

  };


  /* =========================================================
     LOGIN
     ========================================================= */

  loginForm.onsubmit = async (e) => {

    e.preventDefault();


    loginMsg.style.color =
      "#8f9b96";

    loginMsg.textContent =
      "Signing you in…";

    loginButton.disabled = true;


    const email =
      loginEmail.value
        .trim()
        .toLowerCase();

    const password =
      loginPassword.value;


    if(!email || !password){

      loginMsg.style.color =
        "#ff5d6c";

      loginMsg.textContent =
        "Please enter your email and password.";

      loginButton.disabled = false;

      return;

    }


    try{

      const response =
        await fetch(
          `${API_BASE}/api/auth/login`,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              email,
              password
            })
          }
        );


      const data =
        await response.json()
          .catch(() => ({}));


      if(!response.ok){

        throw new Error(
          data.error ||
          data.message ||
          "Invalid email or password."
        );

      }


      /* Save the real backend session */

      saveSession(data);


      loginMsg.style.color =
        "#16e58a";

      loginMsg.textContent =
        "Login successful. Opening dashboard…";


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      },500);


    }catch(error){

      console.error(
        "TradeZora login error:",
        error
      );


      loginMsg.style.color =
        "#ff5d6c";

      loginMsg.textContent =
        error.message ||
        "Unable to log in.";

      loginButton.disabled = false;

    }

  };


  /* =========================================================
     FORGOT PASSWORD
     ========================================================= */

  forgotForm.onsubmit = async (e) => {

    e.preventDefault();


    const email =
      forgotEmail.value
        .trim()
        .toLowerCase();


    if(!email){

      forgotMsg.style.color =
        "#ff5d6c";

      forgotMsg.textContent =
        "Please enter your email address.";

      return;

    }


    forgotMsg.style.color =
      "#8f9b96";

    forgotMsg.textContent =
      "Sending reset link…";

    forgotButton.disabled = true;


    try{

      const response =
        await fetch(
          `${API_BASE}/api/auth/forgot-password`,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              email
            })
          }
        );


      const data =
        await response.json()
          .catch(() => ({}));


      if(!response.ok){

        throw new Error(
          data.error ||
          data.message ||
          "Unable to send reset link."
        );

      }


      /*
        The backend intentionally gives a
        generic response so users cannot
        discover whether an email exists.
      */

      forgotMsg.style.color =
        "#16e58a";

      forgotMsg.textContent =
        data.message ||
        "If an account exists for that email, a password reset link has been sent. Check your inbox and spam folder.";


      forgotButton.disabled = false;


    }catch(error){

      console.error(
        "TradeZora forgot password error:",
        error
      );


      forgotMsg.style.color =
        "#ff5d6c";

      forgotMsg.textContent =
        error.message ||
        "Unable to send reset link.";

      forgotButton.disabled = false;

    }

  };

});

</script>

</body>
</html>
