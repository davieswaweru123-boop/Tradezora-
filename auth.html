<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TradeZora — Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">

  <style>
    /* AUTH PAGE */

    .auth-page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 100px 20px 50px;

      position: relative;
      overflow: hidden;
    }

    .auth-glow {
      position: absolute;

      width: 450px;
      height: 450px;

      border-radius: 50%;

      background: rgba(22, 229, 138, 0.07);

      filter: blur(100px);

      pointer-events: none;
    }

    .auth-card {
      position: relative;
      z-index: 2;

      width: min(440px, 100%);

      padding: 38px;

      border: 1px solid var(--border);

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.045),
          rgba(255,255,255,0.015)
        );

      box-shadow:
        0 30px 100px rgba(0,0,0,0.35);
    }

    .auth-logo {
      display: flex;

      justify-content: center;

      margin-bottom: 30px;
    }

    .auth-heading {
      text-align: center;

      margin-bottom: 30px;
    }

    .auth-heading h1 {
      font-size: 32px;

      letter-spacing: -1.5px;

      margin-bottom: 9px;
    }

    .auth-heading p {
      color: var(--muted);

      font-size: 13px;
    }

    .auth-tabs {
      display: grid;

      grid-template-columns: 1fr 1fr;

      padding: 4px;

      margin-bottom: 25px;

      border-radius: 10px;

      background: rgba(255,255,255,0.035);
    }

    .auth-tab {
      height: 40px;

      border: 0;

      border-radius: 8px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      font-size: 12px;

      font-weight: 700;
    }

    .auth-tab.active {
      background: rgba(22,229,138,0.12);

      color: var(--green);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      color: var(--muted-light);

      font-size: 11px;

      font-weight: 600;
    }

    .form-group input {
      width: 100%;

      height: 48px;

      padding: 0 14px;

      border-radius: 10px;

      border: 1px solid var(--border);

      outline: none;

      background: rgba(0,0,0,0.18);

      color: var(--text);

      font-family: inherit;

      font-size: 13px;

      transition: 0.2s ease;
    }

    .form-group input:focus {
      border-color: rgba(22,229,138,0.45);

      box-shadow:
        0 0 0 3px rgba(22,229,138,0.06);
    }

    .auth-submit {
      width: 100%;

      height: 50px;

      border: 0;

      border-radius: 10px;

      background: var(--green);

      color: #03150d;

      font-weight: 800;

      font-size: 13px;

      cursor: pointer;

      margin-top: 5px;

      transition: 0.25s ease;
    }

    .auth-submit:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(22,229,138,0.2);
    }

    .auth-message {
      display: none;

      margin-top: 16px;

      padding: 11px;

      border-radius: 9px;

      background: rgba(22,229,138,0.08);

      border: 1px solid rgba(22,229,138,0.16);

      color: var(--green);

      font-size: 11px;

      text-align: center;
    }

    .auth-back {
      display: block;

      text-align: center;

      margin-top: 22px;

      color: var(--muted);

      font-size: 11px;
    }

    .auth-back:hover {
      color: var(--green);
    }

    @media (max-width: 500px) {

      .auth-card {
        padding: 28px 20px;
      }

      .auth-heading h1 {
        font-size: 28px;
      }

    }
  </style>
</head>

<body>

  <main class="auth-page">

    <div class="auth-glow"></div>

    <div class="auth-card">

      <!-- LOGO -->

      <div class="auth-logo">

        <a href="index.html" class="logo">

          <span class="logo-icon">↗</span>

          <span>
            Trade<span class="logo-green">Zora</span>
          </span>

        </a>

      </div>


      <!-- HEADING -->

      <div class="auth-heading">

        <h1 id="authTitle">
          Welcome to TradeZora
        </h1>

        <p id="authSubtitle">
          Create your account to get started.
        </p>

      </div>


      <!-- TABS -->

      <div class="auth-tabs">

        <button
          class="auth-tab active"
          id="signupTab"
          type="button"
        >
          Create Account
        </button>

        <button
          class="auth-tab"
          id="loginTab"
          type="button"
        >
          Log In
        </button>

      </div>


      <!-- SIGN UP -->

      <form
        class="auth-form active"
        id="signupForm"
      >

        <div class="form-group">

          <label for="signupName">
            Full Name
          </label>

          <input
            id="signupName"
            type="text"
            placeholder="Enter your name"
            required
          >

        </div>


        <div class="form-group">

          <label for="signupEmail">
            Email Address
          </label>

          <input
            id="signupEmail"
            type="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="signupPassword">
            Password
          </label>

          <input
            id="signupPassword"
            type="password"
            placeholder="Create a password"
            minlength="6"
            required
          >

        </div>


        <button
          class="auth-submit"
          type="submit"
        >
          Create Account
        </button>

      </form>


      <!-- LOGIN -->

      <form
        class="auth-form"
        id="loginForm"
      >

        <div class="form-group">

          <label for="loginEmail">
            Email Address
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            required
          >

        </div>


        <button
          class="auth-submit"
          type="submit"
        >
          Log In
        </button>

      </form>


      <div
        class="auth-message"
        id="authMessage"
      ></div>


      <a
        href="index.html"
        class="auth-back"
      >
        ← Back to TradeZora
      </a>

    </div>

  </main>


  <script>

    const signupTab =
      document.getElementById("signupTab");

    const loginTab =
      document.getElementById("loginTab");

    const signupForm =
      document.getElementById("signupForm");

    const loginForm =
      document.getElementById("loginForm");

    const authTitle =
      document.getElementById("authTitle");

    const authSubtitle =
      document.getElementById("authSubtitle");

    const authMessage =
      document.getElementById("authMessage");


    function showSignup() {

      signupTab.classList.add("active");

      loginTab.classList.remove("active");

      signupForm.classList.add("active");

      loginForm.classList.remove("active");

      authTitle.textContent =
        "Welcome to TradeZora";

      authSubtitle.textContent =
        "Create your account to get started.";

      authMessage.style.display =
        "none";
    }


    function showLogin() {

      loginTab.classList.add("active");

      signupTab.classList.remove("active");

      loginForm.classList.add("active");

      signupForm.classList.remove("active");

      authTitle.textContent =
        "Welcome Back";

      authSubtitle.textContent =
        "Log in to continue to TradeZora.";

      authMessage.style.display =
        "none";
    }


    signupTab.addEventListener(
      "click",
      showSignup
    );


    loginTab.addEventListener(
      "click",
      showLogin
    );


    signupForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        const name =
          document.getElementById("signupName").value;

        const email =
          document.getElementById("signupEmail").value;

        /*
          DEMO ONLY

          This is NOT a real account system.
          We are only storing demo credentials
          locally in the browser for now.
        */

        localStorage.setItem(
          "tradezoraDemoUser",
          JSON.stringify({
            name: name,
            email: email
          })
        );


        authMessage.textContent =
          "Demo account created successfully.";

        authMessage.style.display =
          "block";


        signupForm.reset();

      }
    );


    loginForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        const email =
          document.getElementById("loginEmail").value;


        const storedUser =
          localStorage.getItem(
            "tradezoraDemoUser"
          );


        if (!storedUser) {

          authMessage.textContent =
            "No demo account found. Create an account first.";

          authMessage.style.display =
            "block";

          return;

        }


        const user =
          JSON.parse(storedUser);


        if (email !== user.email) {

          authMessage.textContent =
            "Email does not match the demo account.";

          authMessage.style.display =
            "block";

          return;

        }


        authMessage.textContent =
          "Demo login successful.";

        authMessage.style.display =
          "block";

      }
    );

  </script>

</body>
</html>
