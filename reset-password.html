<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TradeZora — Reset Password</title>
<link rel="stylesheet" href="styles.css">

<style>
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(
    circle at 50% 0,
    #0b2419 0,
    #050807 42%
  );
}

.auth{
  width:min(460px,calc(100% - 30px));
  background:#0c1210;
  border:1px solid #1c2923;
  border-radius:20px;
  padding:30px;
  box-shadow:0 25px 70px #0008;
}

.logo{
  display:block;
  text-align:center;
  margin-bottom:28px;
  color:#fff;
  text-decoration:none;
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:#fff;
}

.form{
  display:grid;
  gap:14px;
}

.form h1{
  font-size:28px;
  margin:0;
}

.form p{
  color:#8f9b96;
  font-size:13px;
  margin:0 0 5px;
  line-height:1.5;
}

.form label{
  font-size:12px;
  color:#c8d0cc;
}

.form input{
  width:100%;
  margin-top:6px;
  padding:13px;
  border-radius:10px;
  border:1px solid #1c2923;
  background:#07100c;
  color:#fff;
  outline:0;
  box-sizing:border-box;
}

.form input:focus{
  border-color:#16e58a;
}

.form button{
  padding:13px;
  border:0;
  border-radius:10px;
  background:#16e58a;
  color:#031009;
  font-weight:800;
  cursor:pointer;
  margin-top:5px;
}

.form button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.msg{
  min-height:20px;
  color:#16e58a;
  font-size:12px;
  text-align:center;
  line-height:1.5;
}

.success{
  color:#16e58a;
}

.error{
  color:#ff5d6c;
}

.login-link{
  display:block;
  text-align:center;
  margin-top:5px;
  color:#8f9b96;
  font-size:12px;
  text-decoration:none;
}

.login-link:hover{
  color:#16e58a;
}

.notice{
  background:#071710;
  border:1px solid #173528;
  border-radius:10px;
  padding:12px;
  color:#8f9b96;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

@media(max-width:520px){

  .auth{
    padding:24px 20px;
    border-radius:16px;
  }

  .form h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<main class="auth">

<a class="logo" href="index.html">
  <span>Trade</span>Zora
</a>


<!-- RESET FORM -->

<form id="resetForm" class="form">

  <h1>Create a new password</h1>

  <p>
    Enter a new password for your TradeZora account.
  </p>


  <label>
    New Password

    <input
      id="password"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="At least 8 characters"
      required
    >
  </label>


  <label>
    Confirm New Password

    <input
      id="confirmPassword"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="Enter your password again"
      required
    >
  </label>


  <button
    id="resetButton"
    type="submit"
  >
    Reset Password
  </button>


  <div
    id="resetMsg"
    class="msg"
  ></div>


  <a
    id="loginLink"
    class="login-link"
    href="auth.html"
    style="display:none"
  >
    ← Return to Log In
  </a>

</form>


<!-- INVALID / MISSING TOKEN -->

<div
  id="invalidToken"
  style="display:none"
  class="form"
>

  <h1>Invalid reset link</h1>

  <p>
    This password reset link is missing, expired,
    or has already been used.
  </p>

  <div class="notice">
    Please request a new password reset link from
    the TradeZora login page.
  </div>

  <a
    class="login-link"
    href="auth.html"
  >
    ← Return to Log In
  </a>

</div>

</main>


<script>

/* =========================================================
   TRADEZORA BACKEND
   ========================================================= */

const API_BASE =
  "https://tradezora-backend-use.onrender.com";


/* =========================================================
   ELEMENTS
   ========================================================= */

const resetForm =
  document.getElementById("resetForm");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const resetButton =
  document.getElementById("resetButton");

const resetMsg =
  document.getElementById("resetMsg");

const loginLink =
  document.getElementById("loginLink");

const invalidToken =
  document.getElementById("invalidToken");


/* =========================================================
   GET RESET TOKEN FROM URL
   ========================================================= */

const params =
  new URLSearchParams(window.location.search);

const token =
  params.get("token");


/* =========================================================
   CHECK TOKEN
   ========================================================= */

if(!token){

  resetForm.style.display =
    "none";

  invalidToken.style.display =
    "grid";

}


/* =========================================================
   RESET PASSWORD
   ========================================================= */

resetForm.onsubmit = async (e) => {

  e.preventDefault();


  if(!token){

    return;

  }


  const password =
    passwordInput.value;

  const confirmPassword =
    confirmPasswordInput.value;


  /* =======================================================
     VALIDATE PASSWORD
     ======================================================= */

  if(password.length < 8){

    resetMsg.className =
      "msg error";

    resetMsg.textContent =
      "Password must be at least 8 characters.";

    return;

  }


  if(password !== confirmPassword){

    resetMsg.className =
      "msg error";

    resetMsg.textContent =
      "The passwords do not match.";

    return;

  }


  /* =======================================================
     SUBMIT
     ======================================================= */

  resetButton.disabled =
    true;

  resetMsg.className =
    "msg";

  resetMsg.textContent =
    "Updating your password…";


  try{

    const response =
      await fetch(
        `${API_BASE}/api/auth/reset-password`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            token,
            password
          })
        }
      );


    const data =
      await response.json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        "Unable to reset your password."
      );

    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    resetMsg.className =
      "msg success";

    resetMsg.textContent =
      "Password reset successfully. You can now log in with your new password.";


    resetButton.style.display =
      "none";


    passwordInput.disabled =
      true;

    confirmPasswordInput.disabled =
      true;


    loginLink.style.display =
      "block";


    /*
      Automatically return to login
      after a short delay.
    */

    setTimeout(() => {

      window.location.href =
        "auth.html";

    },3000);


  }catch(error){

    console.error(
      "TradeZora password reset error:",
      error
    );


    resetMsg.className =
      "msg error";

    resetMsg.textContent =
      error.message ||
      "Unable to reset your password.";

    resetButton.disabled =
      false;

  }

};

</script>

</body>
</html>
